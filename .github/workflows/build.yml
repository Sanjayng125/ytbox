name: Build standalones

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: ytbox-windows
          - os: ubuntu-latest
            artifact: ytbox-linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e . pyinstaller

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller --onedir --name ytbox --hidden-import yt_dlp.extractor --collect-submodules yt_dlp ytbox/main.py
        shell: pwsh

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller \
            --onedir \
            --name ytbox \
            --hidden-import yt_dlp.extractor \
            --collect-submodules yt_dlp \
            ytbox/main.py

      - name: Add README to bundle (Windows)
        if: runner.os == 'Windows'
        run: Copy-Item ./standalone-readmes/WINDOWS_README.md dist\ytbox\README.md
        shell: pwsh

      - name: Add README to bundle (Linux)
        if: runner.os == 'Linux'
        run: cp ./standalone-readmes/LINUX_README.md dist/ytbox/README.md

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/ytbox/
